<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", "Noto Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #16A34A; text-decoration: none; }
    a:hover { color: #15803D; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #F4F4F5; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 0 40px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 40px">
      <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #16A34A; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF1F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5v8l9 5 9-5Z"></path><path d="m3 8 9 5 9-5"></path><path d="M12 13v8"></path></svg>
      </div>
      <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: #09090B">Merch Kit</span>
    </div>
      <nav style="display: flex; align-items: center; gap: 28px; height: 64px; padding-top: 22px">
        <span style="font-size: 14px; font-weight: 400; color: #71717A; padding: 8px 0; border-bottom: 2px solid transparent">Создать генерацию</span>
        <span style="font-size: 14px; font-weight: 500; color: #09090B; padding: 8px 0; border-bottom: 2px solid #16A34A">Каталог</span>
        <span style="font-size: 14px; font-weight: 400; color: #71717A; padding: 8px 0; border-bottom: 2px solid transparent">Профиль</span>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: #F0FDF4; border: 1px solid #BBF7D0">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9.5 9.5h3.5a1.75 1.75 0 0 1 0 3.5H9.5"></path></svg>
        <span style="font-size: 13px; font-weight: 500; color: #15803D">120 баллов</span>
      </div>
      <div style="width: 32px; height: 32px; border-radius: 16px; background: #F4F4F5; border: 1px solid #E4E4E7; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #71717A">ИП</div>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 32px 40px">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; height: 100%">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: #09090B">Каталог генераций</h1>
        <div style="width: 200px"><div style="height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; background: #16A34A; color: #FFF1F2; border: 1px solid #16A34A">Создать генерацию</div></div>
      </div>
      <div style="flex: 1; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 40px">
        <div style="width: 64px; height: 64px; border-radius: 32px; background: #FEF2F2; border: 1px solid #FECACA; display: flex; align-items: center; justify-content: center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"></path><path d="M12 10v4M12 17h.01"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; max-width: 420px">
          <span style="font-size: 18px; font-weight: 600; color: #09090B">Не удалось загрузить каталог</span>
          <span style="font-size: 14px; line-height: 20px; color: #71717A">Генерации на месте — не дошёл запрос. Повторите попытку; если не помогает, обновите страницу.</span>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 4px">
          <div style="width: 160px"><div style="height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; background: #16A34A; color: #FFF1F2; border: 1px solid #16A34A">Повторить</div></div>
          <div style="width: 160px"><div style="height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; background: #FFFFFF; color: #09090B; border: 1px solid #E4E4E7">Создать генерацию</div></div>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
