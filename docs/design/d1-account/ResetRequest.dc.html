<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", "Noto Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #15803D; text-decoration: none; }
    a:hover { color: #15803D; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #F4F4F5; display: flex; flex-direction: column">
  <header style="height: 64px; flex: none; background: #FFFFFF; border-bottom: 1px solid #E4E4E7; padding: 0 40px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #15803D; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5v8l9 5 9-5Z"></path><path d="m3 8 9 5 9-5"></path><path d="M12 13v8"></path></svg>
      </div>
      <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: #09090B">Merch Kit</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #52525B"><span>Вспомнили пароль?</span><a href="#" style="font-weight: 500">Войти</a></div>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px">
    <div style="width: 440px; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 8px; box-shadow: 0 1px 3px rgba(9, 9, 11, 0.06); padding: 32px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: #09090B">Восстановление пароля</h1>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #52525B">Введите email аккаунта — пришлём ссылку для смены пароля.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label style="font-size: 14px; font-weight: 500; color: #09090B">Email</label>
        <div style="height: 40px; border: 1px solid #E4E4E7; border-radius: 6px; background: #FFFFFF; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; ">
          <span style="font-size: 14px; color: #52525B">you@example.com</span>
          
        </div>
        
        
      </div>
      <div style="height: 40px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; background: #15803D; color: #FFFFFF; border: 1px solid #15803D">Отправить ссылку</div>
      <div style="text-align: center; font-size: 14px; color: #52525B"><a href="#" style="font-weight: 500">Вернуться ко входу</a></div></div>
  </main>
</div>
</x-dc>
</body>
</html>
